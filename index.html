<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Isha Ji ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Loading Screen -->
<div id="loader">
    <div class="loader-heart">❤️</div>
    <h2>Preparing a Special Surprise...</h2>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>
</div>

<!-- Main Website -->
<div id="main" class="hidden">

    <div id="hearts"></div>

    <section class="hero">

        <h3>✨ Happy Birthday ✨</h3>

        <h1>Isha Ji ❤️</h1>

        <p>
            Today isn't just another day...
            <br><br>
            It's the day the world became brighter because someone truly special was born.
        </p>

        <button id="enterBtn">
            Open Your Surprise 🎁
        </button>

    </section>

</div>

<!-- Password Popup -->
<div id="passwordScreen" class="popup hidden">

    <div class="popup-card">

        <h2>🔒 A Little Secret</h2>

        <p>
            This surprise was created especially for you, Isha Ji.
            <br><br>
            Enter the secret password to continue.
        </p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter Password">

        <button id="unlockBtn">
            ✨ Unlock ✨
        </button>

        <p id="errorText"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
